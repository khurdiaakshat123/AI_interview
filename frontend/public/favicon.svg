<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
  <style>
    rect.border-rect { stroke: #2A2A2D; fill: #161618; }
    circle.accent-dot { fill: #3FD08F; }
    rect.text-bar { fill: #EDEDED; }
    @media (prefers-color-scheme: light) {
      rect.border-rect { stroke: #D8E1DC; fill: #FFFFFF; }
      circle.accent-dot { fill: #0F7A55; }
      rect.text-bar { fill: #13201A; }
    }
  </style>
  <rect class="border-rect" x="0.5" y="0.5" width="27" height="27" rx="7" stroke="#2A2A2D" fill="#161618"/>
  <circle class="accent-dot" cx="14" cy="8.5" r="2.2" fill="#3FD08F"/>
  <rect class="text-bar" x="12.4" y="13" width="3.2" height="9" rx="1.2" fill="#EDEDED"/>
</svg>
